<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Copilot Hub{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/xterm.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  </head>
  <body class="{% block body_class %}{% endblock %}">
    <header class="app-header">
      <a class="brand" href="/" aria-label="Copilot Hub workspace">Copilot Hub</a>
      <span class="header-note">Personal Manager and Worker sessions</span>
    </header>
    <main class="{% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
