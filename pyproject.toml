[project]
name = "copilot-hub"
version = "0.1.0"
description = "Personal web workspace for persistent Copilot CLI sessions"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
copilot-hub = "copilot_hub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copilot_hub"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.54",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
